# 收录前会核：package.json 有 dsh.bundle（有）、仓库创建满 1 天、加了 dsh-plugin topic、描述与代码一致。
url: https://github.com/super0plant/dsh-plugin-game-time
name: super0plant/dsh-plugin-game-time
category: fun # 娱乐；不要用 usage（那是「用量与计费」）
description:
  en: Tracks per-game play time from running processes and charts daily, weekly, monthly and all-time totals. Data stays on local disk.
  zh: 按运行进程统计每款游戏的游玩时长，按日 / 周 / 月 / 累计出图，数据只留在本机。

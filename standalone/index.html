<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <title>游戏时长 · Game Time</title>
  <link rel="icon" href="/icon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/icon-256.png" />
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      background: #0d0e12;
      color: #e6e8ec;
      font-family: "Segoe UI", "Microsoft YaHei UI", "PingFang SC", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    #root {
      height: 100%;
      min-height: 100%;
    }
    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      opacity: .55;
      pointer-events: none;
    }
    #boot-error {
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: 16px;
      max-height: 40vh;
      overflow: auto;
      margin: 0;
      padding: 12px 14px;
      border-radius: 10px;
      background: rgba(255, 107, 107, .12);
      border: 1px solid rgba(255, 107, 107, .4);
      color: #ffb4b4;
      font: 12px/1.5 ui-monospace, "Cascadia Mono", Consolas, monospace;
      white-space: pre-wrap;
    }
    @media (prefers-color-scheme: light) {
      body { background: #f4f5f7; color: #1b1d22; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="boot">正在启动…</div>
  <pre id="boot-error" hidden></pre>

  <script src="/vendor/react.production.min.js"></script>
  <script src="/vendor/react-dom.production.min.js"></script>
  <script src="/loader.js"></script>
  <script src="/client.js"></script>
  <script>
    (function () {
      var boot = document.getElementById('boot')
      if (boot) boot.remove()
      window.addEventListener('error', function (event) {
        var box = document.getElementById('boot-error')
        if (!box) return
        box.hidden = false
        box.textContent = String(event.message || event.error || 'unknown error')
      })
    })()
  </script>
</body>
</html>
